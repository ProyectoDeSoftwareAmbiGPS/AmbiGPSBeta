name: Pruebas AmbiGPS

on:
  push:
    branches: ["main", "pruebas-alejandro"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verificar:
    name: Compilar y ejecutar todas las pruebas
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: ambigps_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://127.0.0.1:3306/ambigps_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar las pruebas
        run: mvn -B verify
